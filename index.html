<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jacklanch</title>
  <meta name="description" content="Personal portfolio website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navigation -->
  <header class="nav-header">
    <div class="container nav-inner">
      <nav class="nav-links" id="navLinks">
        <a href="#contact">Contact</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- Hero -->
    <section class="hero">
      <canvas id="graphCanvas"></canvas>
      <div class="hero-title-overlay">
        <h1 class="hero-name">Jacklanch</h1>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section section-alt">
      <div class="container contact-container">
        <span class="section-label">Contact</span>
        <h2 class="section-title">Let's Connect</h2>
        <div class="contact-links">
          <a href="#" class="contact-card" id="emailCard">
            <span class="contact-icon">&#9993;</span>
            <span class="contact-name">Email</span>
            <span class="contact-value" id="emailValue">Click to copy</span>
          </a>
          <a href="https://github.com/Jacklanch" class="contact-card">
            <span class="contact-icon">&#10100;</span>
            <span class="contact-name">GitHub</span>
            <span class="contact-value">@Jacklanch</span>
          </a>
          <a href="www.linkedin.com/in/jack-lanchester/" class="contact-card">
            <span class="contact-icon">&#10070;</span>
            <span class="contact-name">LinkedIn</span>
            <span class="contact-value">Jack Lanchester</span>
          </a>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026</p>
      <a href="#" class="back-to-top">Back to top &uarr;</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
